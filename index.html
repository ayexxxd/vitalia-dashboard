<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f4f1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitalia Emergencias</title>
  <script>
    // el tema se pone antes de pintar para que no parpadee. si nadie lo ha elegido sigue al sistema
    (() => {
      let tema = null
      try { tema = localStorage.getItem('vitalia.tema') } catch {}
      if (tema !== 'claro' && tema !== 'oscuro') tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
      document.documentElement.dataset.tema = tema
    })()
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="icono/icono-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icono/icono-512.png">
  <link rel="apple-touch-icon" href="icono/icono-180.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="entrada" class="entrada" hidden>
    <form id="forma-entrada" class="tarjeta-entrada">
      <div class="marca">
        <img class="logo" src="icono/icono-128.png" alt="" width="40" height="40">
        <strong>Vitalia</strong>
      </div>
      <h1>Panel de emergencias</h1>
      <p class="sub">Acceso para Cruz Roja</p>
      <label>
        Dirección de la API
        <input id="campo-api" type="url" required placeholder="https://c1eoch7yl5.execute-api.us-east-2.amazonaws.com">
      </label>
      <label>
        Clave de acceso
        <input id="campo-clave" type="password" required autocomplete="current-password">
      </label>
      <p id="error-entrada" class="error" role="alert" hidden></p>
      <button id="boton-entrar" type="submit">Entrar</button>
    </form>
  </section>

  <div id="panel" class="panel" hidden>
    <header class="barra">
      <div class="marca">
        <img class="logo" src="icono/icono-128.png" alt="" width="40" height="40">
        <div class="marca-texto">
          <strong>Vitalia</strong>
          <span>Cruz Roja · Monterrey</span>
        </div>
      </div>
      <div class="barra-derecha">
        <!-- solo aparece cuando la api no contesta -->
        <span id="estado" class="estado" role="status" hidden>
          <span class="punto" aria-hidden="true"></span>
          Sin conexión
        </span>
        <span id="actualizado" class="actualizado" hidden></span>
        <button id="boton-tema" class="boton-sec boton-tema" type="button" aria-label="Modo oscuro" aria-pressed="false">
          <svg class="icono-luna" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
          <svg class="icono-sol" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        </button>
        <button id="boton-salir" class="boton-sec" type="button">Salir</button>
      </div>
    </header>

    <main class="contenido">
      <section class="lista-col" aria-label="Lista de emergencias">
        <div class="lista-cabeza">
          <h2>Emergencias</h2>
          <p id="conteo" class="conteo"></p>
        </div>
        <div class="filtros">
          <input id="busqueda" type="search" placeholder="Buscar por nombre o teléfono" aria-label="Buscar">
          <div class="rangos" role="group" aria-label="Rango de tiempo">
            <button type="button" data-rango="30m">30 min</button>
            <button type="button" data-rango="24h">Hoy</button>
            <button type="button" data-rango="7d">Semana</button>
            <button type="button" data-rango="todas">Todas</button>
          </div>
        </div>
        <ul id="lista" class="lista"></ul>
      </section>
      <section class="mapa-col" aria-label="Mapa">
        <div id="mapa"></div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
