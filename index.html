<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f4f1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitalia Emergencias</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icono/icono-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icono/icono-512.png">
  <link rel="apple-touch-icon" href="icono/icono-180.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="entrada" class="entrada" hidden>
    <form id="forma-entrada" class="tarjeta-entrada">
      <div class="marca">
        <img class="logo" src="icono/icono-128.png" alt="" width="40" height="40">
        <strong>Vitalia</strong>
      </div>
      <h1>Panel de emergencias</h1>
      <p class="sub">Acceso para Cruz Roja</p>
      <label>
        Dirección de la API
        <input id="campo-api" type="url" required placeholder="https://481810542648-7d2ninj4.us-east-1.console.aws.amazon.com/costmanagement/home?region=us-east-2#/budgets/create/steps/1?validationTrigger=true&stepIndex=0&budgetAmount=1&budgetPeriod=Monthly&budgetPlannerType=FIXED&budgetType=COST&budgetUnit=USD&budgetTags=%5B%5D&isTagsValid=true&utcDates=%7B%22inclusiveStartDateUTC%22%3A%222026-10-01T00%3A00%3A00.000Z%22%2C%22inclusiveEndDateUTC%22%3A%222026-10-31T23%3A59%3A59.999Z%22%7D&usageFilterGroup=USAGE_TYPE_GROUP&usageTypeGroups=%5B%5D&usageTypes=%5B%5D&budgetName=My+Zero-Spend+Budget&budgetEffectiveDate=RECURRING&budgetThreshold=&riUtilizationService=%7B%7D&riCoverageService=%7B%7D&budgetPlannedLimits=%5B%5D&isBudgetDetailsValid=true&didAutoAdjustChange=false&autoAdjustData=undefined&filterExpression=undefined&metrics=undefined&costTypes=undefined&costFilters=undefined&budgetBillingViewType=PRIMARY&budgetBillingViewArn=arn%3Aaws%3Abilling%3A%3A481810542648%3Abillingview%2Fprimary&alerts=%5B%7B%22alertId%22%3A%22af957009-3350-4dc6-952d-b2e4145cb07f%22%2C%22notificationType%22%3A%22ACTUAL%22%2C%22threshold%22%3A%220.01%22%2C%22thresholdType%22%3A%22ABSOLUTE_VALUE%22%2C%22actions%22%3A%5B%5D%2C%22comparisonOperator%22%3A%22GREATER_THAN%22%2C%22notification%22%3A%7B%22emails%22%3A%5B%5D%7D%7D%5D&removedAlerts=%5B%5D&removedActions=%5B%5D&actionErrors=%5B%5D&budgetSetupType=TEMPLATE&budgetTemplateId=zero-spend-budget&tutorialId=create-cost-budget-simplified">
      </label>
      <label>
        Clave de acceso
        <input id="campo-clave" type="password" required autocomplete="current-password">
      </label>
      <p id="error-entrada" class="error" role="alert" hidden></p>
      <button id="boton-entrar" type="submit">Entrar</button>
    </form>
  </section>

  <div id="panel" class="panel" hidden>
    <header class="barra">
      <div class="marca">
        <img class="logo" src="icono/icono-128.png" alt="" width="40" height="40">
        <div class="marca-texto">
          <strong>Vitalia</strong>
          <span>Cruz Roja · Monterrey</span>
        </div>
      </div>
      <div class="barra-derecha">
        <span id="estado" class="estado">
          <span class="punto" aria-hidden="true"></span>
          <span id="estado-texto">Conectando</span>
        </span>
        <span id="actualizado" class="actualizado" hidden></span>
        <button id="boton-sonido" class="boton-sec" type="button" aria-pressed="true">Sonido activado</button>
        <button id="boton-salir" class="boton-sec" type="button">Salir</button>
      </div>
    </header>

    <main class="contenido">
      <section class="lista-col" aria-label="Lista de emergencias">
        <div class="lista-cabeza">
          <h2>Emergencias</h2>
          <p id="conteo" class="conteo"></p>
        </div>
        <div class="filtros">
          <input id="busqueda" type="search" placeholder="Buscar por nombre o teléfono" aria-label="Buscar">
          <div class="rangos" role="group" aria-label="Rango de tiempo">
            <button type="button" data-rango="30m">30 min</button>
            <button type="button" data-rango="24h">Hoy</button>
            <button type="button" data-rango="7d">Semana</button>
            <button type="button" data-rango="todas">Todas</button>
          </div>
        </div>
        <ul id="lista" class="lista"></ul>
      </section>
      <section class="mapa-col" aria-label="Mapa">
        <div id="mapa"></div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
